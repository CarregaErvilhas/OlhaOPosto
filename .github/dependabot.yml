version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(actions)"
      include: "scope"
    groups:
      patch-and-minor:
        update-types:
          - "minor"
          - "patch"
  # Panoramax (pacote `geovisio`). Subir a versão pode trazer migrações da BD:
  # ler o changelog antes do merge (Docs/infra.md, «Atualizar o Panoramax»).
  - package-ecosystem: "pip"
    directory: "/panoramax"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "panoramax"
    commit-message:
      prefix: "deps(panoramax)"
      include: "scope"
