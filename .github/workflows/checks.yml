# Checks for every pull request into main. The `worker` and `panoramax` jobs
# are required status checks in the `main` ruleset.
#
# No `paths` filter on purpose: a required check that never runs leaves the PR
# waiting forever, and the whole job takes well under a minute.

name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci --no-fund --no-audit

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      # Bundles the Worker the way a deploy would, without credentials.
      - name: Build
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-dist"

  # The Panoramax customisations (panoramax/map_override.py: photos on the map
  # from zoom 7; panoramax/author_override.py: the photo's author as its
  # producer) against the geovisio in requirements.txt and the web viewer
  # in panoramax/viewer/package.json. A Dependabot bump of either that breaks
  # them fails here, with what broke and what to do (Docs/infra.md, «Mapa:
  # fotos de uma só foto»).
  panoramax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: panoramax
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            panoramax/requirements.txt
            panoramax/requirements-test.txt

      # The same lock, with hashes, that the pano container installs.
      - run: pip install --require-hashes -r requirements.txt -r requirements-test.txt

      - run: python -m playwright install --with-deps chromium

      - name: Drift tests
        run: python -m pytest -v tests
