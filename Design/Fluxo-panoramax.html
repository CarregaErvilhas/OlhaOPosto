<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluxo olh'o'posto e Panoramax</title>
<style>
body{margin:0;background:#F6F7F5;font-family:Inter,system-ui,sans-serif;color:#15201C}
main{max-width:760px;margin:0 auto;padding:24px 16px}
h1{font-size:20px;font-weight:600;margin:0 0 4px}
p{font-size:14px;color:#4A5751;margin:0 0 16px}
svg text{font-family:Inter,system-ui,sans-serif}
.t{font-size:14px;font-weight:600}
.s{font-size:12px}
</style>
</head>
<body>
<main>
<h1>Fluxo das fotos</h1>
<p>Quem envia entra no olh'o'posto com OSM; o olh'o'posto guarda no Panoramax com uma conta de serviço e copia a foto principal para o bucket R2 dos links estáticos.</p>
<svg width="100%" viewBox="0 0 680 420" role="img" aria-labelledby="ft fd">
<title id="ft">Fluxo olh'o'posto e Panoramax</title>
<desc id="fd">Contribuidor envia para olh'o'posto, que guarda no Panoramax com conta de serviço; links estáticos em pictures servem NAP dashboard e apps; Panoramax federa e o OSM aponta com panoramax=.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#4A5751" stroke-width="1.5"/></marker></defs>
<g fill="none" stroke="#4A5751" stroke-width="1.2" marker-end="url(#a)">
<line x1="200" y1="68" x2="256" y2="68"/><line x1="420" y1="68" x2="476" y2="68"/>
<line x1="340" y1="96" x2="340" y2="166"/><line x1="560" y1="96" x2="560" y2="166"/>
<line x1="340" y1="226" x2="340" y2="296"/><path d="M260 198 L120 198 L120 296"/>
<line x1="560" y1="226" x2="560" y2="296"/>
</g>
<g fill="#EEF1EF" stroke="#8A9690" stroke-width="0.8">
<rect x="40" y="40" width="160" height="56" rx="8"/><rect x="40" y="300" width="160" height="56" rx="8"/>
<rect x="260" y="300" width="160" height="56" rx="8"/><rect x="480" y="300" width="160" height="56" rx="8"/>
</g>
<g fill="#E4EBF2" stroke="#2C4A6B" stroke-width="0.8">
<rect x="260" y="40" width="160" height="56" rx="8"/><rect x="260" y="170" width="160" height="56" rx="8"/>
</g>
<g fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8">
<rect x="480" y="40" width="160" height="56" rx="8"/><rect x="480" y="170" width="160" height="56" rx="8"/>
</g>
<g text-anchor="middle" fill="#15201C">
<text class="t" x="120" y="64">Contribuidor</text><text class="s" x="120" y="82" fill="#4A5751">Desfoca no telemóvel</text>
<text class="t" x="340" y="64" fill="#1F3650">olh'o'posto</text><text class="s" x="340" y="82" fill="#2C4A6B">olhaoposto.* · login OSM</text>
<text class="t" x="560" y="64" fill="#3C3489">Panoramax</text><text class="s" x="560" y="82" fill="#534AB7">Conta de serviço</text>
<text class="t" x="340" y="194" fill="#1F3650">pictures (R2)</text><text class="s" x="340" y="212" fill="#2C4A6B">Links estáticos</text>
<text class="t" x="560" y="194" fill="#3C3489">Federação</text><text class="s" x="560" y="212" fill="#534AB7">api.panoramax.xyz</text>
<text class="t" x="120" y="324">NAP dashboard</text><text class="s" x="120" y="342" fill="#4A5751">Lê photos.json</text>
<text class="t" x="340" y="324">Apps e ohmigo</text><text class="s" x="340" y="342" fill="#4A5751">Links, API, MCP</text>
<text class="t" x="560" y="324">OSM</text><text class="s" x="560" y="342" fill="#4A5751">panoramax=uuid</text>
</g>
<rect x="150" y="388" width="14" height="14" rx="3" fill="#E4EBF2" stroke="#2C4A6B" stroke-width="0.8"/><text class="s" x="172" y="399" fill="#4A5751">olh'o'posto (Cloudflare)</text>
<rect x="350" y="388" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text class="s" x="372" y="399" fill="#4A5751">Panoramax (Zerops)</text>
</svg>
</main>

</html>
