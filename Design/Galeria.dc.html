<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Galeria de fotos dos postos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F7F5}
a{color:#0B6B58}a:hover{color:#08513F}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #15201C; background: #F6F7F5; min-height: 100vh">
  <header style="background: #FFFFFF; border-bottom: 1px solid #DDE3DF">
    <div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #15201C">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0B6B58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"></rect><circle cx="12" cy="13" r="3.5"></circle><path d="M8 6l1.5-2h5L16 6"></path></svg>
        <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 19px">Fotos dos Postos</span>
      </a>
      <nav aria-label="Principal" style="display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 15px; flex: 1 1 auto">
        <a href="Galeria.dc.html" aria-current="page" style="color: #08513F; font-weight: 600; text-decoration: none; padding: 10px 0; border-bottom: 2px solid #0B6B58">Galeria</a>
        <a href="#" style="color: #3F4B46; text-decoration: none; padding: 10px 0">Postos sem foto</a>
        <a href="#" style="color: #3F4B46; text-decoration: none; padding: 10px 0">API e agentes</a>
      </nav>
      <a href="Enviar.dc.html" style="background: #0B6B58; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px; padding: 11px 18px; border-radius: 8px">Enviar fotos</a>
    </div>
  </header>

  <main style="max-width: 1200px; margin: 0 auto; padding: 28px 24px 64px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 18px">
      <div>
        <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 32px">Galeria</h1>
        <p style="margin: 6px 0 0; font-size: 15px; color: #5A6661">Fotos publicadas de postos e tomadas, e o que ainda falta fotografar.</p>
      </div>
      <p style="margin: 0; font-size: 14px; color: #5A6661">{{ countLabel }}</p>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px; background: #FFFFFF; border: 1px solid #DDE3DF; border-radius: 12px; margin-bottom: 20px">
      <label for="g-pesquisa" style="position: absolute; left: -9999px">Pesquisar</label>
      <input id="g-pesquisa" type="search" placeholder="Código, EVSE, morada" style="flex: 1 1 240px; font: inherit; font-size: 15px; padding: 11px 12px; border: 1px solid #C9D2CD; border-radius: 8px; color: #15201C">
      <label for="g-op" style="position: absolute; left: -9999px">Operador</label>
      <select id="g-op" style="font: inherit; font-size: 15px; min-height: 44px; padding: 0 10px; border: 1px solid #C9D2CD; border-radius: 8px; background: #FFFFFF; color: #15201C">
        <option>Todos os operadores</option><option>TRK</option><option>CNT · Continente</option><option>IOY · Ionity</option><option>TSL · Tesla</option>
      </select>
      <label for="g-conc" style="position: absolute; left: -9999px">Concelho</label>
      <select id="g-conc" style="font: inherit; font-size: 15px; min-height: 44px; padding: 0 10px; border: 1px solid #C9D2CD; border-radius: 8px; background: #FFFFFF; color: #15201C">
        <option>Todos os concelhos</option>
      </select>
      <div role="group" aria-label="Mostrar" style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{ chips }}" as="c" hint-placeholder-count="4">
          <button type="button" aria-pressed="{{ c.pressed }}" onClick="{{ c.pick }}" style="{{ c.style }}">{{ c.label }}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="8">
        <article style="background: #FFFFFF; border: 1px solid #DDE3DF; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column">
          <sc-if value="{{ it.has }}" hint-placeholder-val="{{ true }}">
            <div role="img" aria-label="{{ it.alt }}" style="aspect-ratio: 4 / 3; background: {{ it.tint }}; display: flex; align-items: flex-end; padding: 10px; box-sizing: border-box">
              <span style="font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 4px; background: rgba(255,255,255,0.9); color: #15201C">{{ it.kind }}</span>
            </div>
          </sc-if>
          <sc-if value="{{ it.missing }}" hint-placeholder-val="{{ false }}">
            <a href="Enviar.dc.html" style="aspect-ratio: 4 / 3; border-bottom: 1px dashed #A9B5AF; background: #F6F7F5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: #08513F; font-size: 14px; font-weight: 600">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
              Sem foto · enviar
            </a>
          </sc-if>
          <div style="padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px">
            <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ it.code }}</div>
            <div style="font-size: 13px; color: #5A6661">{{ it.meta }}</div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px">
              <span style="font-size: 12px; color: #5A6661">{{ it.credit }}</span>
              <a href="Main.dc.html" style="font-size: 13px">Abrir</a>
            </div>
          </div>
        </article>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'all' }; }
  renderVals() {
    const f = this.state.filter;
    const raw = [
      { code: 'TRK-VNT-00005', kind: 'Posto', op: 'TRK', has: true, tint: '#CFD9D3' },
      { code: 'PTTRKEVNT0000501', kind: 'Tomada', op: 'TRK', has: true, tint: '#D7DFDA' },
      { code: 'PTTRKEVNT0000502', kind: 'Tomada', op: 'TRK', has: false },
      { code: 'CNT-0379PR0002', kind: 'Posto', op: 'Continente', has: true, tint: '#D3DCE0' },
      { code: 'PTCNTE0379PR00021', kind: 'Tomada', op: 'Continente', has: true, tint: '#DCE2E5' },
      { code: 'PTCNTE0379PR00022', kind: 'Tomada', op: 'Continente', has: true, tint: '#D6DDE1' },
      { code: 'PTCNTE0379PR00023', kind: 'Tomada', op: 'Continente', has: false },
      { code: 'IOY-GDM-00070', kind: 'Posto', op: 'Ionity', has: true, tint: '#DAD7E0' },
      { code: 'PTIOYE473771', kind: 'Tomada', op: 'Ionity', has: true, tint: '#E0DDE5' },
      { code: 'PTIOYE473772', kind: 'Tomada', op: 'Ionity', has: true, tint: '#DCD9E2' },
      { code: 'TSL-eddf8de0-ea2f-4d4a-90d4-f0e5639662a1', kind: 'Posto', op: 'Tesla', has: true, tint: '#E2DAD6' },
      { code: 'PTTSLE25TKLL', kind: 'Tomada', op: 'Tesla', has: true, tint: '#E6DFDB' },
      { code: 'PTTSLE25TKOB', kind: 'Tomada', op: 'Tesla', has: false }
    ];
    const keep = (r) => f === 'all' || (f === 'postos' && r.kind === 'Posto' && r.has) || (f === 'tomadas' && r.kind === 'Tomada' && r.has) || (f === 'missing' && !r.has);
    const items = raw.filter(keep).map((r) => ({
      code: r.code, kind: r.kind, has: r.has, missing: !r.has, tint: r.tint || '#E1E7E3',
      alt: r.kind + ' ' + r.code + ' (exemplo)',
      meta: r.kind + ' · ' + r.op,
      credit: r.has ? '[autor] · CC BY-SA 4.0' : 'Ninguém fotografou ainda'
    }));
    const defs = [['all', 'Tudo'], ['postos', 'Postos'], ['tomadas', 'Tomadas'], ['missing', 'Sem foto']];
    const chips = defs.map(([id, label]) => ({
      label, pressed: f === id ? 'true' : 'false',
      style: 'font: inherit; font-size: 14px; min-height: 44px; padding: 0 14px; border-radius: 999px; cursor: pointer; ' + (f === id ? 'border: 1px solid #0B6B58; background: #E3F1EC; color: #08513F; font-weight: 600' : 'border: 1px solid #C9D2CD; background: #FFFFFF; color: #3F4B46'),
      pick: () => this.setState({ filter: id })
    }));
    const countLabel = items.length + ' resultados (dados de exemplo)';
    return { items, chips, countLabel };
  }
}
</script>
</body>
</html>
