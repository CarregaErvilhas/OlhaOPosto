# olh'o'posto no Zerops: servidor Panoramax (serviço `pano`).
#
# Só o runtime. O PostgreSQL (hostname `db`) cria-se à parte, com o
# `zerops-import.yaml`, e este serviço puxa as variáveis dele por referência
# `${db_variavel}`. Tudo o que é segredo (FS_URL com as chaves do R2,
# FLASK_SECRET_KEY) é variável secreta do serviço `pano` no Zerops, nunca
# está no repositório. Ver Docs/infra.md.
#
# Deploy: webhook do Zerops no push para `main` (Docs/infra.md, «Deploy»).
# À mão, em último recurso: `zcli push pano --setup pano` na raiz do repo.
zerops:
  - setup: pano
    build:
      # Não há nada a compilar: o Panoramax vem do PyPI (`geovisio`) e é
      # instalado no runtime (prepareCommands), que fica em cache enquanto o
      # requirements.txt não mudar.
      # 3.14: a mais recente no Zerops (só existe em Ubuntu). O Panoramax
      # anuncia suporte ao 3.14 no changelog e as dependências binárias têm
      # wheels cp314 para glibc (verificado no PyPI para a 2.17.0).
      base: python@3.14
      os: ubuntu
      deployFiles:
        - panoramax
      addToRunPrepare:
        - panoramax/requirements.txt
    deploy:
      # Rolling: o container novo entra antes de o velho sair.
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 5000
          path: /api/configuration
        # As migrações correm nos initCommands antes do arranque; numa BD
        # vazia são ~200 e podem levar um minuto.
        failureTimeout: "240s"
        retryPeriod: "10s"
    run:
      # Ubuntu e não Alpine: o pyexiv2 (dependência do geopic-tag-reader) só
      # tem wheels para glibc, e o Python 3.14 do Zerops só existe em Ubuntu.
      base: ubuntu/python@3.14
      prepareCommands:
        # venv: o pip do sistema no Ubuntu 24.04 recusa instalar fora de um
        # venv (PEP 668). Em /opt e não em /home/zerops: o `pano` tem de o
        # atravessar, e o Ubuntu cria as casas com 0750.
        - sudo install -d -o zerops -g zerops -m 0755 /opt/venv
        - python3 -m venv /opt/venv
        # requirements.txt é o lock com hashes (gerado do requirements.in):
        # nenhuma dependência entra sem hash conhecido.
        - /opt/venv/bin/pip install --no-cache-dir --require-hashes -r /home/zerops/panoramax/requirements.txt
        # Utilizador sem sudo, sem shell e sem casa para os processos. O
        # `zerops` tem sudo.
        - sudo useradd --system --no-create-home --shell /usr/sbin/nologin pano
      # Antes de qualquer processo arrancar (API e worker): extensões e
      # permissões com o superuser, depois as migrações com o dono da BD.
      # Se falhar antes do commit, o readiness chumba e a versão anterior
      # continua a servir. Uma migração com commit não se desfaz: em subidas
      # do Panoramax com migrações, backup e temporaryShutdown: true
      # (Docs/infra.md, «Atualizar o Panoramax»).
      initCommands:
        - /opt/venv/bin/python /var/www/panoramax/bootstrap_db.py
        - env -u PANO_DB_SUPERUSER_URL /opt/venv/bin/panoramax_backend db upgrade
      startCommands:
        # API (gunicorn). O Zerops corre o comando em bash. `wsgi:app` é o
        # panoramax/wsgi.py, que decide em que X-Forwarded-* confiar
        # (Docs/infra.md, «Proxies»).
        # `env -u`: o superuser não chega aos processos.
        - name: api
          user: pano
          command: >-
            env -u PANO_DB_SUPERUSER_URL HOME=/tmp
            /opt/venv/bin/gunicorn
            --bind 0.0.0.0:5000 --workers 2 --threads 4 --timeout 120
            --access-logfile - --pythonpath /var/www/panoramax wsgi:app
        # Processamento das fotos (tamanhos, metadados) e o cron de
        # estatísticas. Separado da API: PICTURE_PROCESS_THREADS_LIMIT=0.
        - name: worker
          user: pano
          command: >-
            env -u PANO_DB_SUPERUSER_URL HOME=/tmp
            /opt/venv/bin/panoramax_backend picture-worker
      # A grelha que o mapa mostra nos zooms 0 a 6 é uma tabela que o
      # Panoramax só atualiza com `db refresh`: sem isto, uma foto aprovada
      # só aparece no mapa a partir do zoom 15.
      crontab:
        - timing: "17 * * * *"
          workingDir: /var/www
          command: env -u PANO_DB_SUPERUSER_URL /opt/venv/bin/panoramax_backend db refresh
          allContainers: false
      ports:
        - port: 5000
          httpSupport: true
      healthCheck:
        httpGet:
          port: 5000
          path: /api/configuration
      envVariables:
        # --- Base de dados. Porta 5432 direta, não o pgBouncer (6432): o
        # Panoramax passa `-c statement_timeout=…` nas opções de arranque da
        # ligação, que o pgBouncer recusa, e as migrações usam SET de sessão. ---
        DB_URL: ${db_connectionString}
        PANO_DB_SUPERUSER_URL: postgresql://${db_superUser}:${db_superUserPassword}@${db_hostname}:5432/${db_dbName}
        PANO_DB_APP_USER: ${db_user}
        DB_MAX_CNX: "5"
        # --- Instância ---
        API_SUMMARY: >-
          {"name": {"pt": "olh'o'posto — fotos de postos de carregamento",
          "en": "olh'o'posto — EV charger photos"},
          "description": {"pt": "Fotos de postos de carregamento em Portugal, enviadas pelo olh'o'posto",
          "en": "Photos of EV charging stations in Portugal, uploaded through olh'o'posto"},
          "geo_coverage": {"pt": "Portugal\nSó postos de carregamento, enviados pelo olh'o'posto.",
          "en": "Portugal\nCharging stations only, uploaded through olh'o'posto."},
          "email": "OlhaOPosto@ocarroeletrico.com",
          "color": "#2C4A6B"}
        API_WEBSITE_URL: "false"
        API_PICTURES_LICENSE_SPDX_ID: CC-BY-SA-4.0
        API_PICTURES_LICENSE_URL: https://creativecommons.org/licenses/by-sa/4.0/
        # --- Contas e envio: sem OAuth. O olh'o'posto envia com a conta
        # `OlhaOPosto` (papel `user`), criada por panoramax/service_account.py. ---
        API_REGISTRATION_IS_OPEN: "false"
        API_FORCE_AUTH_ON_UPLOAD: "true"
        # Fica gravado na BD no primeiro arranque; mudar aqui depois não tem
        # efeito (Docs/infra.md, «Configuração gravada na BD»).
        API_DEFAULT_PICTURE_VISIBILITY: owner-only
        # --- Processamento ---
        PICTURE_PROCESS_THREADS_LIMIT: "0"
        PICTURE_PROCESS_DERIVATES_STRATEGY: PREPROCESS
        # --- Rede: sem INFRA_NB_PROXIES de propósito. Aplicava a mesma
        # contagem aos cinco X-Forwarded-*; quem confia nos proxies é o
        # panoramax/wsgi.py (Docs/infra.md, «Proxies»). ---
        API_LOG_LEVEL: info
